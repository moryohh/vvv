services:
  - type: web
    name: saif-qalam-nora-ai-moryohh
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGIN
        value: https://moryohh.github.io
      - key: GEMINI_API_KEY
        sync: false
