<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>حلّ معي</title>
  <meta name="description" content="منصة تعليمية لحل المسائل خطوة بخطوة من ملفات JSON.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23182b50'/%3E%3Cpath d='M19 16h26v34H19z' fill='%23fff'/%3E%3Cpath d='M25 26h14M25 34h14M25 42h8' stroke='%23efb529' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#122342;--navy2:#1d3764;--blue:#2d74da;--sky:#edf5ff;--gold:#f2b72d;--red:#ef3d58;--green:#149867;--ink:#17233a;--muted:#68738a;--line:#dfe6f0;--paper:#fff;--bg:#eef2f7;--shadow:0 12px 35px #10244718}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tahoma","Arial",sans-serif;min-height:100vh}.hidden{display:none!important}button,input{font:inherit}button{cursor:pointer}.app{max-width:860px;margin:auto;min-height:100vh;background:#f8fafc;box-shadow:0 0 40px #14213d18}.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 18px;border-bottom:3px solid #edb936}.toprow{display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#3c87ef,#1c57a9);display:grid;place-items:center;font-size:23px}.brand h1{font-size:1.2rem;margin:0}.brand small{display:block;color:#b8c7df;margin-top:2px}.wallet{display:flex;gap:8px}.pill{height:40px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:16px;background:#203a63;border:1px solid #35517c;font-weight:800}.pill.apples{color:#90ecbd}.pill.hearts{color:#ff9bac}.upload-mini{border:1px solid #7b642d;background:#493b20;color:#ffd664;border-radius:13px;padding:9px 12px;font-weight:700}.progress{height:4px;background:#304564;margin-top:11px;border-radius:9px;overflow:hidden}.progress span{display:block;background:var(--gold);height:100%;width:0;transition:.35s}
    main{padding:22px}.empty{min-height:calc(100vh - 90px);display:grid;place-items:center}.upload-card{width:min(100%,620px);background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px;text-align:center;box-shadow:var(--shadow)}.upload-mark{width:84px;height:84px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;background:#eaf3ff;color:var(--blue);font-size:40px}.upload-card h2{margin:0 0 12px;font-size:1.55rem}.upload-card p{color:var(--muted);line-height:1.9;margin:0 auto 22px;max-width:450px}.primary{border:0;background:var(--blue);color:white;border-radius:14px;padding:14px 22px;font-weight:800;box-shadow:0 7px 16px #2d74da35}.error{margin-top:14px;color:#bd1e3b;background:#fff0f2;border-radius:10px;padding:10px;line-height:1.6}
    .lesson-head{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}.lesson-meta{display:flex;align-items:center;gap:9px;color:var(--blue);font-weight:800;margin-bottom:10px}.lesson-head h2{font-size:1.2rem;line-height:1.8;margin:0}.diagram{display:block;max-width:100%;max-height:330px;margin:16px auto 0;border-radius:14px;border:1px solid var(--line)}.stepnav{display:flex;gap:8px;overflow:auto;padding:2px 1px 12px;scrollbar-width:none}.stepdot{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 14px;font-weight:700}.stepdot.active{background:var(--navy);color:#fff;border-color:var(--navy)}.stepdot.done{background:#e5f8ef;color:#08774f;border-color:#b9e8d3}.map-card{background:linear-gradient(135deg,#eef6ff,#f8fbff);border:1px solid #cfe0f7;border-right:6px solid var(--blue);padding:20px;border-radius:18px;margin-bottom:16px}.map-label{color:#2762b2;font-size:.9rem;font-weight:800;margin-bottom:8px}.map-card p{font-size:1.05rem;line-height:1.9;margin:0;font-weight:600}.work-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.work-title{display:flex;align-items:center;gap:10px;margin-bottom:10px}.step-num{width:35px;height:35px;border-radius:11px;background:#fff0d1;color:#8b5c00;display:grid;place-items:center;font-weight:900}.work-title h3{margin:0;font-size:1.1rem}.input-label{line-height:1.8;color:#45516a;margin:14px 0;font-weight:700}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.option{min-height:58px;background:#f9fbfd;border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font-weight:700;line-height:1.5;text-align:right;transition:.18s}.option:hover{border-color:#8eb7ef}.option.selected{border-color:var(--blue);background:#edf5ff}.option.correct{border-color:var(--green);background:#e9f9f2;color:#08714d}.option.wrong{border-color:var(--red);background:#fff0f3;color:#b8233c}.answer-actions{display:flex;gap:10px;margin-top:15px}.check{flex:1;border:0;background:var(--navy);color:#fff;border-radius:14px;padding:13px;font-weight:800}.calc-open{width:52px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:21px}.feedback{border-radius:12px;margin-top:13px;padding:11px 13px;font-weight:700}.feedback.good{background:#e8f8f1;color:#08754f}.feedback.bad{background:#fff0f2;color:#b2243e}.bottom-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}.assist,.hint{border:0;border-radius:16px;padding:14px;color:#fff;font-weight:900}.assist{background:linear-gradient(135deg,#eb3755,#c71939)}.hint{background:linear-gradient(135deg,#f5b824,#db8512)}.cost{font-size:.82rem;opacity:.88;display:block;margin-top:3px}.panel{margin-top:12px;border-radius:18px;padding:18px;animation:rise .25s ease}.panel h4{margin:0 0 10px}.panel p{margin:0;line-height:1.85}.hint-panel{background:#fff8e6;border:1px solid #f3d68d}.assist-panel{background:#ebf8f3;border:1px solid #b8e5d3}.topics{border-top:1px solid #e8cf8d;margin-top:14px;padding-top:12px}.topic{background:#fff;border-radius:12px;padding:12px;margin-top:8px}.topic b{color:#91600c;display:block;margin-bottom:5px}.question-switcher{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;margin-top:14px}.qchip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;color:#516078}.qchip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .modal{position:fixed;inset:0;z-index:50;background:#081425a8;display:grid;place-items:center;padding:18px}.modal-box{width:min(100%,390px);background:#fff;border-radius:24px;padding:19px;box-shadow:0 25px 60px #0004}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0}.close{border:0;background:#eef2f7;width:36px;height:36px;border-radius:11px}.display{direction:ltr;text-align:left;width:100%;background:#eef3f8;border:0;border-radius:14px;padding:17px;margin:16px 0;font-size:1.5rem}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key{border:0;border-radius:12px;padding:14px 5px;background:#edf1f6;font-weight:800}.key.op{background:#e8f1ff;color:#2363b9}.key.equal{background:var(--blue);color:#fff}.celebrate{text-align:center;padding:28px}.celebrate .big{font-size:56px}.celebrate h2{margin:4px}.celebrate p{color:var(--muted);line-height:1.7}
    @keyframes rise{from{opacity:0;transform:translateY(5px)}}
    @media(max-width:620px){.topbar{padding:10px 12px}.brand small{display:none}.brand h1{font-size:1rem}.logo{width:37px;height:37px}.pill{height:36px;padding:0 9px}.upload-mini{font-size:.82rem;padding:8px}.wallet{gap:5px}main{padding:14px}.upload-card{padding:27px 19px}.options{grid-template-columns:1fr}.work-card{padding:17px}.lesson-head{padding:15px}.map-card{padding:16px}.bottom-actions{position:sticky;bottom:8px;z-index:10}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand"><div class="logo">✦</div><div><h1>حلّ معي</h1><small id="subtitle">تعلّم الحل، لا تحفظه</small></div></div>
      <div class="wallet"><div class="pill apples"><span id="apples">100</span> 🍏</div><div class="pill hearts"><span id="hearts">10</span> ♥</div></div>
      <button class="upload-mini" id="uploadMini">إضافة JSON</button>
    </div>
    <div class="progress"><span id="progress"></span></div>
  </header>
  <main>
    <section class="empty" id="empty">
      <div class="upload-card">
        <div class="upload-mark">↥</div>
        <h2>أضف درسًا وابدأ الحل</h2>
        <p>ارفع ملف JSON الذي يحتوي على الأسئلة والخطوات. لن تُعرض أي بيانات تجريبية؛ محتوى الدرس سيأتي من ملفك فقط.</p>
        <button class="primary" id="uploadMain">اختيار ملف JSON</button>
        <div id="fileError" class="error hidden"></div>
      </div>
    </section>
    <section id="lesson" class="hidden">
      <div class="lesson-head">
        <div class="lesson-meta"><span id="qNumber"></span><span>•</span><span id="pageNumber"></span></div>
        <h2 id="qText"></h2><img id="diagram" class="diagram hidden" alt="الرسم المرفق بالسؤال">
        <div class="question-switcher" id="questionSwitcher"></div>
      </div>
      <div class="stepnav" id="stepNav"></div>
      <div class="map-card"><div class="map-label">◎ الخريطة الذهنية والهدف من هذه الخطوة</div><p id="stepExplanation"></p></div>
      <div id="workArea"></div>
      <div class="bottom-actions"><button class="assist" id="assistBtn">مساعدة<span class="cost">تحلّ الخطوة • 4 🍏</span></button><button class="hint" id="hintBtn">تلميح<span class="cost">شرح إضافي • 2 🍏</span></button></div>
      <div id="extraPanel"></div>
    </section>
  </main>
</div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<div class="modal hidden" id="calcModal"><div class="modal-box"><div class="modal-head"><h3>الحاسبة</h3><button class="close" id="closeCalc">✕</button></div><input id="calcDisplay" class="display" value="" readonly><div class="keys" id="keys"></div></div></div>
<script>
  const $=s=>document.querySelector(s); let data=null,qIndex=0,stepIndex=0,selected=null,locked=false;
  const today=new Date().toISOString().slice(0,10); const saved=JSON.parse(localStorage.getItem('solve-with-me-wallet')||'{}');
  let apples=saved.date===today?Math.max(0,Number(saved.apples)||0):100, hearts=10;
  function saveWallet(){localStorage.setItem('solve-with-me-wallet',JSON.stringify({date:today,apples}))} function counters(){ $('#apples').textContent=apples;$('#hearts').textContent=hearts;saveWallet() } counters();
  function openPicker(){ $('#fileInput').click() } $('#uploadMain').onclick=openPicker;$('#uploadMini').onclick=openPicker;
  $('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);validate(parsed);data=parsed;qIndex=0;resetQuestion();$('#empty').classList.add('hidden');$('#lesson').classList.remove('hidden');render()}catch(err){showError('تعذّر فتح الملف: '+err.message)}};r.readAsText(f,'utf-8');e.target.value=''};
  function validate(x){if(!x||!Array.isArray(x.exam_questions)||!x.exam_questions.length)throw Error('يجب أن يحتوي الملف على exam_questions غير فارغة.');x.exam_questions.forEach((q,i)=>{if(!Array.isArray(q.interactive_steps)||!q.interactive_steps.length)throw Error('السؤال رقم '+(i+1)+' لا يحتوي على interactive_steps.');q.interactive_steps.forEach((s,j)=>{if(!s.step_explanation||!Array.isArray(s.inputs)||!s.inputs.length)throw Error('بيانات الخطوة '+(j+1)+' في السؤال '+(i+1)+' غير مكتملة.');s.inputs.forEach(inp=>{if(!Array.isArray(inp.options)||!inp.options.length||inp.correct_answer===undefined)throw Error('خيارات إحدى الإجابات غير مكتملة.')})})})}
  function showError(t){$('#fileError').textContent=t;$('#fileError').classList.remove('hidden')}
  function resetQuestion(){stepIndex=0;hearts=10;selected=null;locked=false;counters();$('#extraPanel').innerHTML=''}
  function q(){return data.exam_questions[qIndex]} function step(){return q().interactive_steps[stepIndex]}
  function cleanUrl(url){if(!url)return'';const m=String(url).match(/\((https?:\/\/[^)]+)\)/);return m?m[1]:String(url).replace(/^\[|\]$/g,'')}
  function render(){const question=q(),s=step();$('#qNumber').textContent=question.question_number||('السؤال '+(qIndex+1));$('#pageNumber').textContent='صفحة '+(data.page_number??'—');$('#qText').textContent=question.question_text||'';$('#stepExplanation').textContent=s.step_explanation;$('#subtitle').textContent=`السؤال ${qIndex+1} من ${data.exam_questions.length}`; const img=$('#diagram'),u=cleanUrl(question.diagram&&question.diagram.image_url);if(u){img.src=u;img.classList.remove('hidden')}else img.classList.add('hidden');
    $('#questionSwitcher').innerHTML=data.exam_questions.map((x,i)=>`<button class="qchip ${i===qIndex?'active':''}" data-q="${i}">${escapeHtml(x.question_number||('سؤال '+(i+1)))}</button>`).join('');
    document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{qIndex=+b.dataset.q;resetQuestion();render()});
    $('#stepNav').innerHTML=question.interactive_steps.map((x,i)=>`<button class="stepdot ${i===stepIndex?'active':i<stepIndex?'done':''}" disabled>الخطوة ${x.step_number??i+1}</button>`).join('');
    const inp=s.inputs[0];$('#workArea').innerHTML=`<div class="work-card"><div class="work-title"><span class="step-num">${s.step_number??stepIndex+1}</span><h3>أكمل هذه الخطوة</h3></div><div class="input-label">${escapeHtml(inp.label||'اختر الإجابة الصحيحة')}</div><div class="options">${inp.options.map((o,i)=>`<button class="option" data-option="${i}">${escapeHtml(o)}</button>`).join('')}</div><div class="answer-actions"><button class="check" id="checkBtn">تحقق من الإجابة</button><button class="calc-open" id="openCalc" aria-label="فتح الحاسبة">⌗</button></div><div id="feedback"></div></div>`;
    document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(locked)return;selected=inp.options[+b.dataset.option];document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('#checkBtn').onclick=checkAnswer;$('#openCalc').onclick=()=>$('#calcModal').classList.remove('hidden');$('#progress').style.width=((stepIndex)/question.interactive_steps.length*100)+'%';$('#extraPanel').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
  function checkAnswer(){if(locked)return;if(selected===null){feedback('اختر إجابة أولًا.','bad');return}const inp=step().inputs[0],buttons=[...document.querySelectorAll('.option')],idx=inp.options.indexOf(selected);if(String(selected).trim()===String(inp.correct_answer).trim()){locked=true;buttons[idx]?.classList.add('correct');feedback('أحسنت! إجابة صحيحة.','good');setTimeout(nextStep,700)}else{buttons[idx]?.classList.add('wrong');hearts--;counters();feedback('ليست صحيحة، جرّب مرة أخرى أو استخدم التلميح.','bad');selected=null;if(hearts<=0)setTimeout(()=>{alert('انتهت القلوب. سنعيد حل السؤال من البداية بقلب كامل.');resetQuestion();render()},600)}}
  function feedback(t,type){$('#feedback').innerHTML=`<div class="feedback ${type}">${t}</div>`}
  function nextStep(){if(stepIndex<q().interactive_steps.length-1){stepIndex++;selected=null;locked=false;render()}else{showComplete()}}
  function showComplete(){$('#progress').style.width='100%';$('#workArea').innerHTML=`<div class="work-card celebrate"><div class="big">🏅</div><h2>أكملت السؤال!</h2><p>أنهيت جميع خطوات الحل بنجاح.</p><button class="primary" id="nextQuestion">${qIndex<data.exam_questions.length-1?'السؤال التالي':'العودة لأول سؤال'}</button></div>`;$('.bottom-actions').classList.add('hidden');$('#extraPanel').innerHTML='';$('#nextQuestion').onclick=()=>{qIndex=qIndex<data.exam_questions.length-1?qIndex+1:0;resetQuestion();$('.bottom-actions').classList.remove('hidden');render()}}
  function spend(cost){if(apples<cost){alert('لا يوجد تفاح كافٍ. يتجدد رصيدك إلى 100 تفاحة في اليوم الجديد.');return false}apples-=cost;counters();return true}
  $('#hintBtn').onclick=()=>{if(!data||!spend(2))return;const h=step().hint||{};$('#extraPanel').innerHTML=`<div class="panel hint-panel"><h4>💡 تلميح لهذه الخطوة</h4><p>${escapeHtml(h.step_hint_text||'راجع شرح الخطوة وحدد العلاقة بين المعطيات.')}</p>${Array.isArray(h.related_topics)&&h.related_topics.length?`<div class="topics"><h4>مواضيع ذات صلة</h4>${h.related_topics.map(t=>`<div class="topic"><b>${escapeHtml(t.topic_title||'شرح إضافي')}</b><p>${escapeHtml(t.explanation||'')}</p></div>`).join('')}</div>`:''}</div>`;$('#extraPanel').scrollIntoView({behavior:'smooth',block:'nearest'})};
  $('#assistBtn').onclick=()=>{if(!data||locked||!spend(4))return;const inp=step().inputs[0];selected=inp.correct_answer;locked=true;document.querySelectorAll('.option').forEach((b,i)=>{if(String(inp.options[i]).trim()===String(inp.correct_answer).trim())b.classList.add('correct')});$('#extraPanel').innerHTML=`<div class="panel assist-panel"><h4>✓ حلّ المساعدة هذه الخطوة</h4><p>${escapeHtml(step().step_assistant_solution||String(inp.correct_answer))}</p></div>`;setTimeout(nextStep,1150)};
  function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  const keyValues=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','⌫','='];$('#keys').innerHTML=keyValues.map(k=>`<button class="key ${'÷×−'.includes(k)?'op':''} ${k==='='?'equal':''}" data-key="${k}">${k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const d=$('#calcDisplay'),k=b.dataset.key;if(k==='⌫')d.value=d.value.slice(0,-1);else if(k==='='){try{const exp=d.value.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[0-9+*/.()\s-]+$/.test(exp))throw 0;d.value=Function('return ('+exp+')')()}catch{d.value='خطأ'}}else d.value+=k});$('#closeCalc').onclick=()=>$('#calcModal').classList.add('hidden');$('#calcModal').onclick=e=>{if(e.target.id==='calcModal')e.currentTarget.classList.add('hidden')};
</script>
</body>
</html>
