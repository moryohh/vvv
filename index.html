<style>.equationRows{width:100%;display:grid;gap:19px;justify-items:center;overflow-x:auto;padding:5px 0 12px}.equationRow{display:flex;align-items:center;justify-content:center;gap:9px;min-width:max-content;font-size:1.25rem;font-weight:900;direction:ltr}.mathToken{white-space:pre-wrap;unicode-bidi:isolate}.equationRow .fraction{display:inline-flex;flex-direction:column;align-items:center;gap:5px}.equationRow .fraction .fracline{height:3px;width:100%;min-width:95px}.fractionPart{display:flex;align-items:center;justify-content:center;gap:7px;direction:ltr}@media(max-width:620px){.equationRow{font-size:1.05rem;gap:5px}.equationRows{justify-items:start}.equationRow .ibox{width:57px;height:55px}}</style>
<script>
window.addEventListener('load',()=>{
  const previousNormalize=normalize,previousCanvas=canvasHtml;
  normalize=function(data){
    const questions=previousNormalize(data);
    // ملفات الامتحانات القديمة قد تجمع نتيجتين داخل إجابة واحدة.
    // نفصلها فقط عندما تنقسم الخيارات الأربعة بالطريقة نفسها.
    for(const question of questions)for(const step of question.steps){
      if(step.layout)continue;
      const expanded=[];const rows=[];
      for(const input of step.inputs){
        const separator=input.correct.includes(' و ')?' و ':input.correct.includes(' ، ')?' ، ':null;
        const pieces=separator?input.correct.split(separator).map(x=>x.trim()):[];
        const optionParts=separator?input.options.map(x=>x.split(separator).map(y=>y.trim())):[];
        if(pieces.length>1&&optionParts.every(parts=>parts.length===pieces.length)){
          const row=[];
          pieces.forEach((value,index)=>{
            if(index)row.push(separator);
            const id=`${input.id}_part_${index+1}`;
            const choices=[...new Set(optionParts.map(parts=>parts[index]))];
            const match=value.match(/\d+(?:[,.]\d+)?/);
            if(match){let delta=1;while(choices.length<4&&delta<50){
              const original=Number(match[0].replace(',','.'));
              const proposed=String(original+delta).replace('.',match[0].includes(',')?',':'.');
              const candidate=value.replace(match[0],proposed);
              if(!choices.includes(candidate))choices.push(candidate);
              delta++;
            }}
            expanded.push({...input,id,label:`${input.label} — الجزء ${index+1}`,correct:value,options:choices});
            row.push({input_id:id});
          });
          rows.push(row);
        }else{expanded.push(input);rows.push([{input_id:input.id}])}
      }
      if(expanded.length!==step.inputs.length){step.inputs=expanded;step.layout={rows}}
    }
    for(const question of questions)for(const step of question.steps){
      if(!step.inputs.length)throw Error(`الخطوة ${step.id}: لا توجد مربعات إدخال.`);
      const ids=new Set();
      for(const input of step.inputs){
        if(ids.has(input.id))throw Error(`الخطوة ${step.id}: معرف المربع مكرر (${input.id}).`);
        ids.add(input.id);
        if(!input.correct||input.options.length!==4||new Set(input.options).size!==4||!input.options.includes(input.correct))throw Error(`المربع ${input.id}: يلزم جواب صحيح موجود ضمن أربعة خيارات مختلفة.`);
      }
      if(step.layout){
        const used=[];
        function walk(tokens){
          if(!Array.isArray(tokens))throw Error(`الخطوة ${step.id}: layout يجب أن يكون مصفوفة.`);
          for(const token of tokens){
            if(typeof token==='string')continue;
            if(!token||typeof token!=='object')throw Error(`الخطوة ${step.id}: رمز غير صالح في layout.`);
            if(token.input_id||token.id)used.push(String(token.input_id||token.id));
            else if(token.fraction){walk(token.fraction.numerator);walk(token.fraction.denominator)}
            else if(typeof token.text!=='string')throw Error(`الخطوة ${step.id}: رمز غير معروف في layout.`);
          }
        }
        const rows=Array.isArray(step.layout)?step.layout:step.layout.rows;
        if(!Array.isArray(rows))throw Error(`الخطوة ${step.id}: layout.rows مفقودة.`);
        for(const row of rows)walk(Array.isArray(row)?row:[row]);
        if(used.length!==ids.size||used.some(id=>!ids.has(id))||new Set(used).size!==ids.size)throw Error(`الخطوة ${step.id}: يجب ظهور كل input_id مرة واحدة في layout.`);
      }
    }
    return questions;
  };
  canvasHtml=function(step){
    if(!step.layout)return previousCanvas(step);
    const rows=Array.isArray(step.layout)?step.layout:step.layout.rows;
    function tokens(items){return items.map(token=>{
      if(typeof token==='string')return`<span class="mathToken">${esc(token)}</span>`;
      if(token.input_id||token.id)return box(step,String(token.input_id||token.id));
      if(token.fraction)return`<span class="fraction"><span class="fractionPart">${tokens(token.fraction.numerator)}</span><i class="fracline"></i><span class="fractionPart">${tokens(token.fraction.denominator)}</span></span>`;
      return`<span class="mathToken">${esc(token.text)}</span>`;
    }).join('')}
    return`<div class="equationRows">${rows.map(row=>`<div class="equationRow">${tokens(Array.isArray(row)?row:[row])}</div>`).join('')}</div>`;
  };
});
</script>
<script>
const $=s=>document.querySelector(s);let raw=null,problems=[],problemIndex=0,answers={},activeId=null,hearts=10;const day=new Date().toISOString().slice(0,10),wallet=JSON.parse(localStorage.getItem('vvv-wallet')||'{}');let apples=wallet.day===day?Math.max(0,+wallet.apples||0):100;function saveWallet(){localStorage.setItem('vvv-wallet',JSON.stringify({day,apples}))}function stats(){$('#apples').textContent=apples;$('#hearts').textContent=hearts;saveWallet()}stats();function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function pick(){$('#file').click()}$('#uploadTop').onclick=pick;$('#uploadMain').onclick=pick;
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{raw=JSON.parse(r.result);problems=normalize(raw);if(!problems.length)throw Error('لم أعثر على سؤال أو خطوات قابلة للعرض.');problemIndex=0;resetProblem();$('#empty').classList.add('hidden');$('#lesson').classList.remove('hidden');render()}catch(x){$('#error').textContent='تعذّر قراءة الملف: '+x.message;$('#error').classList.remove('hidden')}};r.readAsText(f,'utf-8');e.target.value=''};
const sampleBtn=document.createElement('button');sampleBtn.className='primary';sampleBtn.style.cssText='margin-inline-start:8px;background:#e62c4c';sampleBtn.textContent='تجربة نموذج الكيمياء المرفق';$('#uploadMain').after(sampleBtn);sampleBtn.onclick=async()=>{try{raw=await(await fetch('chemistry-example.json')).json();problems=normalize(raw);problemIndex=0;resetProblem();$('#empty').classList.add('hidden');$('#lesson').classList.remove('hidden');render()}catch(x){$('#error').textContent='تعذّر فتح نموذج الكيمياء.';$('#error').classList.remove('hidden')}};
function normalize(x){if(Array.isArray(x.exam_questions))return x.exam_questions.map((q,qi)=>({id:q.question_number||qi+1,title:q.question_text||'',meta:`${q.question_number||'السؤال '+(qi+1)} • صفحة ${x.page_number??'—'}`,givens:q.atomic_weights||'',diagram:q.diagram&&q.diagram.image_url,steps:(q.interactive_steps||[]).map((s,si)=>normStep(s,si))}));if(Array.isArray(x.steps))return[{id:x.problem_id||1,title:x.title||x.question_text||'',meta:x.category||'المسألة',givens:x.atomic_weights||x.givens||'',diagram:x.diagram&&x.diagram.image_url,steps:x.steps.map((s,i)=>normStep(s,i))}];if(Array.isArray(x.questions))return x.questions.map((q,i)=>({id:q.id||i+1,title:q.title||q.question_text||'',meta:q.category||`السؤال ${i+1}`,givens:q.givens||'',diagram:q.diagram,steps:(q.steps||[]).map((s,j)=>normStep(s,j))}));return[]}
function normStep(s,i){return{id:s.step_id??s.step_number??i+1,title:s.title||`الخطوة ${s.step_number??i+1}`,explanation:s.explanation||s.step_explanation||'',think:s.think||s.explanation||s.step_explanation||'',template:s.template_type||'generic',layout:s.layout||null,inputs:(s.inputs||[]).map((n,j)=>({id:n.id||n.input_id||`s${i+1}_${j+1}`,label:n.label||`المربع ${j+1}`,correct:String(n.correct_value??n.correct_answer??''),options:(n.allowed_keys||n.options||[]).map(String),hint:n.specific_hint||(s.hint&&s.hint.step_hint_text)||'',topics:n.related_topics||(s.hint&&s.hint.related_topics)||[]}))}}
function current(){return problems[problemIndex]}function allInputs(){return current().steps.flatMap(s=>s.inputs)}function active(){return allInputs().find(i=>i.id===activeId)}function resetProblem(){answers={};hearts=10;activeId=null;const p=problems[problemIndex];if(p&&p.steps[0]&&p.steps[0].inputs[0])activeId=p.steps[0].inputs[0].id;stats()}function cleanUrl(v){if(!v)return'';const m=String(v).match(/\((https?:\/\/[^)]+)\)/);return m?m[1]:String(v).replace(/^\[|\]$/g,'')}
function render(){const p=current();$('#qmeta').textContent=p.meta;$('#qtitle').textContent=p.title;$('#sub').textContent=`المسألة ${problemIndex+1} من ${problems.length}`;$('#givens').textContent=p.givens;$('#givens').classList.toggle('hidden',!p.givens);const img=$('#diagram'),url=cleanUrl(p.diagram);if(url){img.src=url;img.classList.remove('hidden')}else img.classList.add('hidden');$('#qnav').innerHTML=problems.length>1?problems.map((q,i)=>`<button class="qtab ${i===problemIndex?'active':''}" data-q="${i}">${esc(q.meta.split('•')[0])}</button>`).join(''):'';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{problemIndex=+b.dataset.q;resetProblem();render()});$('#steps').innerHTML=p.steps.map((s,i)=>stepHtml(s,i)).join('');bindBoxes();document.querySelectorAll('[data-explain]').forEach(b=>b.onclick=()=>showExplanation(b.dataset.explain));updateProgress()}
function stepHtml(s,i){const solved=s.inputs.filter(x=>answers[x.id]!==undefined).length,done=s.inputs.length&&solved===s.inputs.length;return`<article class="step ${done?'complete':''}" id="step_${esc(s.id)}"><div class="stepBar"><span class="stepNo">${i+1}</span><div class="stepTitle">${esc(s.title)}</div><button class="explain" data-explain="${esc(s.id)}" aria-label="شرح هذه الخطوة">◎</button></div>${s.explanation?`<div class="stepGoal">${esc(s.explanation)}</div>`:''}<div class="canvas">${canvasHtml(s)}</div><div class="stepFoot"><span>${solved} من ${s.inputs.length} مربعات</span><span class="${done?'done':''}">${done?'✓ اكتملت الخطوة':'أكمل المربعات بالترتيب'}</span></div></article>`}
function box(s,id){const n=s.inputs.find(x=>x.id===id);if(!n)return'';const solved=answers[id]!==undefined,isActive=id===activeId;return`<span class="iboxWrap"><button class="ibox ${solved?'solved':isActive?'active':''}" data-input="${esc(id)}">${solved?esc(answers[id]):'<span aria-hidden="true" style="opacity:.38;font-size:1.45rem">✎</span>'}</button><span class="ilabel">${esc(n.label)}</span></span>`}
function canvasHtml(s){if(Array.isArray(s.layout))return`<div class="equation">${s.layout.map(x=>typeof x==='string'?`<span>${esc(x)}</span>`:box(s,x.input_id||x.id)).join('')}</div>`;const ids=s.inputs.map(x=>x.id);if(s.template==='molar_mass_breakdown'&&ids.length>=5)return`<div class="equation"><span>( 16 ×</span>${box(s,ids[4])}<span>) + (</span>${box(s,ids[3])}<span>×</span>${box(s,ids[2])}<span>) + (</span>${box(s,ids[1])}<span>×</span>${box(s,ids[0])}<span>) = M</span></div>`;if(s.template==='molar_mass_sum'&&ids.length>=4)return`<div style="display:grid;gap:22px"><div class="equation">${box(s,ids[0])}<span>+</span>${box(s,ids[1])}<span>+</span>${box(s,ids[2])}<span>= M</span></div><div class="equation"><span>g/mol</span>${box(s,ids[3])}<span>= M</span></div></div>`;if(s.template==='percentage_formula'&&ids.length>=5)return`<div style="display:grid;gap:24px"><div class="equation"><span>100%</span><span>×</span><span class="fraction"><span style="display:flex;align-items:center;gap:8px">${box(s,ids[0])}<b>×</b>${box(s,ids[1])}</span><i class="fracline"></i><span>${box(s,ids[2])}</span></span><span>= %C</span></div><div class="equation"><span>%</span>${box(s,ids[4])}<span>= 100% ×</span>${box(s,ids[3])}<span>= %C</span></div></div>`;return`<div class="genericGrid">${s.inputs.map(n=>`<div class="genericItem">${box(s,n.id)}</div>`).join('')}</div>`}
function bindBoxes(){document.querySelectorAll('[data-input]').forEach(b=>b.onclick=()=>openInput(b.dataset.input))}function openInput(id){if(answers[id]!==undefined)return;activeId=id;render();const n=active();$('#choiceTarget').textContent=n.label;const opts=[...n.options].sort(()=>Math.random()-.5);$('#choices').innerHTML=opts.map(o=>`<button class="choice" data-choice="${esc(o)}">${esc(o)}</button>`).join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>submit(b.dataset.choice));$('#choiceOverlay').classList.remove('hidden')}
function submit(value){const n=active();if(!n)return;if(String(value).trim()===n.correct.trim()){answers[n.id]=value;close('choiceOverlay');advance();render()}else{hearts--;stats();const el=document.querySelector(`[data-input="${CSS.escape(n.id)}"]`);if(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),400)}if(hearts<=0)setTimeout(()=>{alert('انتهت القلوب. سيعاد حل هذه المسألة من البداية.');close('choiceOverlay');resetProblem();render()},450)}}function advance(){const a=allInputs(),i=a.findIndex(x=>x.id===activeId);activeId=a[i+1]?a[i+1].id:null}
function updateProgress(){const a=allInputs(),done=a.filter(x=>answers[x.id]!==undefined).length,p=a.length?done/a.length*100:0;$('#progress').style.width=p+'%';$('#counter').textContent=`الخانات المكتملة ${done} من ${a.length}`;$('#complete').innerHTML=done===a.length&&a.length?`<div class="completeBanner"><div class="medal">🏅</div><h2>اكتملت ورقة الحل</h2><p>أحسنت، أكملت جميع خطوات ومربعات المسألة.</p></div>`:'';$('#helpBtn').disabled=!activeId;$('#hintBtn').disabled=!activeId}
function showExplanation(stepId){const s=current().steps.find(x=>String(x.id)===String(stepId));$('#infoTitle').textContent='◎ شرح هذه الخطوة';$('#infoText').textContent=s.think||s.explanation||'راجع هدف الخطوة ثم أكمل المربعات بالترتيب.';$('#topics').classList.add('hidden');$('#infoOverlay').classList.remove('hidden')}function spend(n){if(apples<n){alert('لا يوجد تفاح كافٍ. يتجدد الرصيد إلى 100 في اليوم الجديد.');return false}apples-=n;stats();return true}
$('#hintBtn').onclick=()=>{const n=active();if(!n||!spend(2))return;$('#infoTitle').textContent='💡 تلميح للمربع الحالي';$('#infoText').textContent=n.hint||'راجع شرح الخطوة والمعطيات المرتبطة بهذا المربع.';const t=$('#topics');if(n.topics&&n.topics.length){t.innerHTML='<b>مواضيع مرتبطة</b>'+n.topics.map(x=>`<div class="topic">${esc(typeof x==='string'?x:(x.topic_title||x.explanation||''))}</div>`).join('');t.classList.remove('hidden')}else t.classList.add('hidden');$('#infoOverlay').classList.remove('hidden')};$('#helpBtn').onclick=()=>{const n=active();if(!n||!spend(4))return;answers[n.id]=n.correct;advance();render()};function close(id){$('#'+id).classList.add('hidden')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)close(o.id)});
$('#calcBtn').onclick=()=>$('#calcOverlay').classList.remove('hidden');const kv=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','⌫','='];$('#keys').innerHTML=kv.map(k=>`<button class="key ${'÷×−'.includes(k)?'op':''} ${k==='='?'eq':''}" data-key="${k}">${k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const d=$('#calcDisplay'),k=b.dataset.key;if(k==='⌫')d.value=d.value.slice(0,-1);else if(k==='='){try{const z=d.value.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[0-9+*/.()\s-]+$/.test(z))throw 0;d.value=Function('return ('+z+')')()}catch{d.value='خطأ'}}else d.value+=k});
</script></body></html>
