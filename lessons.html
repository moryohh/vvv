<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصول رياضيات السادس العلمي — حلّ معي</title>
<style>
:root{--navy:#112748;--blue:#2879df;--line:#dae4ee;--ink:#182743;--soft:#f2f6fb}*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{background:var(--navy);color:white;padding:20px max(18px,calc((100vw - 980px)/2));border-bottom:5px solid #edba37}header a{color:#fff5d8}h1{margin:12px 0 5px;font-size:1.45rem}header p{margin:0;color:#c3d4e9;line-height:1.8}main{max-width:980px;margin:24px auto;padding:0 15px 40px}.chapter{background:white;border:1px solid var(--line);border-radius:19px;overflow:hidden;margin:15px 0;box-shadow:0 8px 24px #162d4b0c}.chapter>summary{padding:21px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}.chapter>summary::-webkit-details-marker{display:none}.chapter>summary .number{background:#fff0ca;color:#885d06;padding:9px 13px;border-radius:11px;font-weight:900}.chapter>summary b{flex:1}.count{color:#54749d;font-size:.85rem}.content{padding:0 18px 20px}.topic{border-top:1px solid var(--line);padding:15px 0}.topic h3{font-size:1rem;margin:0 0 12px}.pages{display:flex;flex-wrap:wrap;gap:8px}.page{display:inline-flex;gap:7px;align-items:center;color:#1456ad;text-decoration:none;background:#edf5ff;border:1px solid #cfe1f9;border-radius:11px;padding:11px 12px;font-weight:800}.page small{font-weight:400;color:#54749d}.page:hover,.page:focus{background:#dbeaff}.absent{background:#fff8e8;color:#855816;padding:15px;border-radius:12px;line-height:1.7}.error{color:#ae2439;padding:20px}@media(max-width:620px){header{padding:17px}.chapter>summary{padding:16px;flex-wrap:wrap}.count{width:100%;padding-right:52px}.page{flex:1 0 110px;justify-content:space-between}}
</style></head><body><header><a href="index.html">← ورقة الحل</a><h1>رياضيات السادس العلمي</h1><p>المنهج العراقي • اختر الفصل، ثم الموضوع، ثم صفحة الأسئلة.</p></header><main id="catalog">جارٍ تحميل الفصول…</main>
<script>
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('lessons/catalog.json').then(response=>{if(!response.ok)throw Error('تعذّر فتح فهرس الدروس');return response.json()}).then(data=>{
  document.querySelector('#catalog').innerHTML=data.chapters.map((chapter,index)=>{
    const total=chapter.topics.reduce((n,t)=>n+t.pages.length,0);
    return`<details class="chapter" ${index===0?'open':''}><summary><span class="number">${chapter.id}</span><b>الفصل ${chapter.id}: ${escapeHtml(chapter.title)}</b><span class="count">${total} صفحة</span></summary><div class="content">${total?chapter.topics.filter(t=>t.pages.length).map(topic=>`<section class="topic"><h3>${escapeHtml(topic.title)}</h3><div class="pages">${topic.pages.map(p=>`<a class="page" href="index.html?page=${p.page}">صفحة ${p.page} <small>${p.questions} سؤال${p.read_only?' • '+p.read_only+' بلا خطوات':''}</small></a>`).join('')}</div></section>`).join(''):'<div class="absent">لا توجد ملفات مرفوعة لهذا الفصل في الأرشيف الحالي.</div>'}</div></details>`
  }).join('');
}).catch(error=>{document.querySelector('#catalog').innerHTML=`<div class="error">${escapeHtml(error.message)}</div>`});
</script></body></html>
